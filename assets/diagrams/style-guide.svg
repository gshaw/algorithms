<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 332" role="img" aria-label="A sample diagram in the clean card style: a reference, a subject, the angle between them as a wash, the sun, a guide, and a key">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #1f2937; }
    line, path, circle, ellipse, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .card { fill: #f6f8fa; }
    .frame { fill: none; stroke: #d0d7de; }
    .ink { stroke: #1f2937; fill: none; } .inkfill { fill: #1f2937; }
    .muted { stroke: #6b7280; fill: none; } .mutedfill { fill: #6b7280; } text.muted { fill: #6b7280; stroke: none; }
    .hair { stroke: #d0d7de; fill: none; } .hairfill { fill: #d0d7de; }
    .accent { stroke: #2a78d6; fill: none; } .accentfill { fill: #2a78d6; } text.accent { fill: #2a78d6; stroke: none; }
    .wash { fill: #2a78d6; fill-opacity: 0.14; }
    .sun { fill: #eda100; }
    .ground { fill: #eef1f4; }
    .moondark { fill: #d0d7de; } .rim { stroke: #9aa5b1; fill: none; }
    .halo { paint-order: stroke; stroke: #f6f8fa; stroke-width: 5px; stroke-linejoin: round; }
    .dash { stroke-dasharray: 3 3; stroke-linecap: butt; }
    .small { font-size: 13px; } .strong { font-weight: 600; } .big { font-size: 26px; font-weight: 600; }
    .caps { font-size: 11px; letter-spacing: 0.08em; font-weight: 600; }
    .day { fill: #fdf3d4; } .civil { fill: #d7e6f8; } .nautical { fill: #a6c6ee; } .astro { fill: #5b8fd4; } .night { fill: #1d3a6b; }
    text.deep { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; }
      .card { fill: #161b22; }
      .frame { stroke: #30363d; }
      .ink { stroke: #e5e7eb; } .inkfill { fill: #e5e7eb; }
      .muted { stroke: #9aa5b1; } .mutedfill { fill: #9aa5b1; } text.muted { fill: #9aa5b1; }
      .hair { stroke: #3a414b; } .hairfill { fill: #3a414b; }
      .accent { stroke: #6aa7ee; } .accentfill { fill: #6aa7ee; } text.accent { fill: #6aa7ee; }
      .wash { fill: #6aa7ee; fill-opacity: 0.2; }
      .ground { fill: #1c232d; }
      .moondark { fill: #3a414b; } .rim { stroke: #6b7280; }
      .day { fill: #3a3320; } .civil { fill: #2b4a78; } .nautical { fill: #1f365a; } .astro { fill: #15243e; } .night { fill: #0a1222; }
      text.deep { fill: #e5e7eb; }
      .halo { stroke: #161b22; }
    }
  </style>
  <rect class="card" width="560" height="332" rx="12"/>
  <line class="muted dash" x1="40" y1="240" x2="280" y2="240" stroke-width="1"/>
  <text x="276" y="232" class="small muted" text-anchor="end">Guide</text>
  <path class="wash" d="M110 240 L110 130 A110 110 0 0 1 156.5 140.3 Z"/>
  <path class="accent" d="M110 130 A110 110 0 0 1 156.5 140.3" stroke-width="1.5"/>
  <line class="muted" x1="110" y1="240" x2="110" y2="70" stroke-width="2"/><path class="mutedfill" d="M110 60 L104.5 73 L115.5 73 Z"/>
  <text x="110" y="44" class="muted" text-anchor="middle">Reference</text>
  <line class="ink" x1="110" y1="240" x2="181.8" y2="85.9" stroke-width="2.5"/><path class="inkfill" d="M186.1 76.9 L175.6 86.3 L185.6 91 Z"/>
  <text x="196" y="76">Subject</text>
  <text x="150" y="180" class="accent strong">The angle</text>
  <circle class="sun" cx="266" cy="112" r="11"/>
  <text x="266" y="142" class="small" text-anchor="middle">Light</text>
  <circle class="inkfill" cx="110" cy="240" r="4"/>
  <rect class="card" x="320" y="36" width="16" height="16" rx="4"/>
  <rect class="hair" x="320" y="36" width="16" height="16" rx="4" stroke-width="1"/>
  <text x="348" y="49" class="small">Card</text>
  <circle class="inkfill" cx="328" cy="70" r="8"/>
  <text x="348" y="75" class="small">Ink</text>
  <circle class="mutedfill" cx="328" cy="96" r="8"/>
  <text x="348" y="101" class="small">Muted</text>
  <circle class="hairfill" cx="328" cy="122" r="8"/>
  <text x="348" y="127" class="small">Hairline</text>
  <circle class="accentfill" cx="328" cy="148" r="8"/>
  <text x="348" y="153" class="small">Accent</text>
  <rect class="wash" x="320" y="166" width="16" height="16" rx="4"/>
  <rect class="hair" x="320" y="166" width="16" height="16" rx="4" stroke-width="1"/>
  <text x="348" y="179" class="small">Accent wash</text>
  <circle class="sun" cx="328" cy="200" r="8"/>
  <text x="348" y="205" class="small">Light</text>
  <line class="ink" x1="320" y1="240" x2="360" y2="240" stroke-width="2.5"/>
  <text x="372" y="245" class="small">2.5 px, the subject</text>
  <line class="accent" x1="320" y1="262" x2="360" y2="262" stroke-width="1.5"/>
  <text x="372" y="267" class="small">1.5 px, an angle's arc</text>
  <line class="muted dash" x1="320" y1="284" x2="360" y2="284" stroke-width="1"/>
  <text x="372" y="289" class="small">1 px dashed, a guide</text>
  <text x="20" y="316" class="muted small">Labels 15 px, notes 13 px, system font. The caption goes here, in one sentence.</text>
</svg>
