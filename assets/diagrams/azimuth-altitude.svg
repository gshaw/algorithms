  <circle class="mutedfill" cx="250" cy="160" r="2.5"/>
  <text x="250" y="150" class="small muted strong" text-anchor="middle">N</text>
  <circle class="mutedfill" cx="445" cy="222" r="2.5"/>
  <text x="457" y="227" class="small muted strong" text-anchor="middle">E</text>
  <circle class="mutedfill" cx="250" cy="284" r="2.5"/>
  <text x="250" y="304" class="small muted strong" text-anchor="middle">S</text>
  <circle class="mutedfill" cx="55" cy="222" r="2.5"/>
  <text x="43" y="227" class="small muted strong" text-anchor="middle">W</text>
  <line class="muted dash" x1="250" y1="222" x2="250" y2="160" stroke-width="1"/>
  <line class="muted dash" x1="250" y1="222" x2="418.9" y2="253" stroke-width="1"/>
  <line class="muted dash" x1="418.9" y1="253" x2="418.9" y2="108" stroke-width="1"/>
  <line class="ink" x1="250" y1="222" x2="418.9" y2="96" stroke-width="2"/>
  <path class="accent" d="M352.3 240.8 A104 104 0 0 0 333.4 159.8" stroke-width="2"/>
  <circle class="sun" cx="418.9" cy="96" r="11"/>
  <circle class="inkfill" cx="250" cy="222" r="4"/>
  <text x="240" y="242" class="small" text-anchor="end">You</text>
  <text x="364" y="186" class="accent strong halo">Altitude 35°</text>
  <text x="364" y="203" class="small muted halo">up from the horizon</text>
  <text x="400" y="308" class="accent strong">Azimuth 120°</text>
  <text x="400" y="325" class="small muted">clockwise from north</text>
  <text x="20" y="352" class="muted small">Every sky position becomes these two angles for a place on the ground.</text>
</svg>
