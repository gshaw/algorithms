<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" role="img" aria-label="Sunrise, sunset and the three twilights, by how far the sun's centre is below the horizon">
    <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #1f2937; }
    .bg { fill: #ffffff; }
    .ink { stroke: #1f2937; fill: none; }
    .fill { fill: #1f2937; }
    .muted { stroke: #6b7280; fill: none; }
    .mutedfill { fill: #6b7280; }
    text.muted { fill: #6b7280; stroke: none; }
    .accent { stroke: #2a78d6; fill: none; }
    .accentfill { fill: #2a78d6; }
    text.accent { fill: #2a78d6; stroke: none; }
    .small { font-size: 13px; }
    .band1 { fill: #bfdbfe; } .band2 { fill: #93c5fd; } .band3 { fill: #60a5fa; } .band4 { fill: #3b82f6; } .night { fill: #1e3a8a; }
    .day { fill: #fef9c3; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; }
      .bg { fill: #161b22; }
      .ink { stroke: #e5e7eb; }
      .fill { fill: #e5e7eb; }
      .muted { stroke: #9aa5b1; } .mutedfill { fill: #9aa5b1; } text.muted { fill: #9aa5b1; }
      .accent { stroke: #6aa7ee; } .accentfill { fill: #6aa7ee; } text.accent { fill: #6aa7ee; }
      .band1 { fill: #1e3a5f; } .band2 { fill: #1b3354; } .band3 { fill: #172a47; } .band4 { fill: #12213a; } .night { fill: #0b1220; }
      .day { fill: #3b3a1e; }
    }
  </style>
  <rect class="bg" width="520" height="330" rx="12"/>
  <!-- Vertical scale: 10 px per degree. Horizon at y=70. -->
  <rect class="day" x="20" y="20" width="480" height="50"/>
  <rect class="band1" x="20" y="70" width="480" height="60"/>
  <rect class="band2" x="20" y="130" width="480" height="60"/>
  <rect class="band3" x="20" y="190" width="480" height="60"/>
  <rect class="night" x="20" y="250" width="480" height="40"/>
  <line class="ink" x1="20" y1="70" x2="500" y2="70" stroke-width="2"/>
  <text x="30" y="50">Day</text>
  <text x="494" y="64" class="small" text-anchor="end">Horizon 0°</text>
  <text x="30" y="105">Civil twilight</text>
  <text x="30" y="165">Nautical twilight</text>
  <text x="30" y="225">Astronomical twilight</text>
  <text x="30" y="276" style="fill:#e5e7eb">Night</text>
  <text x="494" y="124" class="small" text-anchor="end">−6°</text>
  <text x="494" y="184" class="small" text-anchor="end">−12°</text>
  <text x="494" y="244" class="small" text-anchor="end" style="fill:#e5e7eb">−18°</text>
  <line class="ink" x1="20" y1="130" x2="500" y2="130" stroke-width="1"/>
  <line class="ink" x1="20" y1="190" x2="500" y2="190" stroke-width="1"/>
  <line class="ink" x1="20" y1="250" x2="500" y2="250" stroke-width="1"/>
  <!-- The sun's centre at −0.833°: 8 px below the horizon. -->
  <circle cx="200" cy="78" r="12" fill="#eda100"/>
  <line class="ink" x1="216" y1="84" x2="236" y2="92" stroke-width="1"/>
  <text x="242" y="98" class="small">Rise and set: centre at −0.833°</text>
  <text class="muted small" x="20" y="312">Altitude of the sun's centre. −0.833° is refraction (34′) plus the sun's radius (16′).</text>
</svg>
