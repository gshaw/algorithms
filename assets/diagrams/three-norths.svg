<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 340" role="img" aria-label="True, grid and magnetic north, and the three angles between them">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #1f2937; }
    .bg { fill: #ffffff; }
    .ink { stroke: #1f2937; fill: none; }
    .fill { fill: #1f2937; }
    .muted { stroke: #6b7280; fill: none; }
    .mutedfill { fill: #6b7280; }
    text.muted { fill: #6b7280; stroke: none; }
    .accent { stroke: #2a78d6; fill: none; }
    .accentfill { fill: #2a78d6; }
    text.accent { fill: #2a78d6; stroke: none; }
    .small { font-size: 13px; }
    .band1 { fill: #bfdbfe; } .band2 { fill: #93c5fd; } .band3 { fill: #60a5fa; } .band4 { fill: #3b82f6; } .night { fill: #1e3a8a; }
    .day { fill: #fef9c3; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; }
      .bg { fill: #161b22; }
      .ink { stroke: #e5e7eb; }
      .fill { fill: #e5e7eb; }
      .muted { stroke: #9aa5b1; } .mutedfill { fill: #9aa5b1; } text.muted { fill: #9aa5b1; }
      .accent { stroke: #6aa7ee; } .accentfill { fill: #6aa7ee; } text.accent { fill: #6aa7ee; }
      .band1 { fill: #1e3a5f; } .band2 { fill: #1b3354; } .band3 { fill: #172a47; } .band4 { fill: #12213a; } .night { fill: #0b1220; }
      .day { fill: #3b3a1e; }
    }
  </style>
  <rect class="bg" width="460" height="340" rx="12"/>
  <line class="muted" x1="200" y1="290" x2="200" y2="80" stroke-width="2"/>
  <text class="muted" x="194" y="78" text-anchor="end">★ True north</text>
  <g transform="rotate(5 200 290)">
    <line class="ink" x1="200" y1="290" x2="200" y2="80" stroke-width="2"/>
    <path class="fill" d="M200 70 l-6 14 h12 z"/>
  </g>
  <text x="228" y="80">Grid north</text>
  <g transform="rotate(20 200 290)">
    <line class="accent" x1="200" y1="290" x2="200" y2="80" stroke-width="2.5"/>
    <path class="accentfill" d="M200 70 l-7 14 h7 z"/>
  </g>
  <text class="accent" x="275" y="100">Magnetic north</text>
  <!-- Arcs: convergence 0-5° at r=190, G-M angle 5-18° at r=160, declination 0-18° at r=120 -->
  <path class="ink" d="M200 100 A190 190 0 0 1 216.6 100.7" stroke-width="1.5"/>
  <path class="accent" d="M213.9 130.6 A160 160 0 0 1 254.7 139.6" stroke-width="1.5"/>
  <path class="muted" d="M200 170 A120 120 0 0 1 241.0 177.2" stroke-width="1.5"/>
  <text x="20" y="120" class="small">Grid convergence</text>
  <text x="20" y="136" class="small muted">true to grid, 5° here</text>
  <text x="300" y="150" class="small accent">G-M angle</text>
  <text x="300" y="166" class="small muted">grid to magnetic, 15° here</text>
  <text x="248" y="200" class="small">Declination</text>
  <text x="248" y="216" class="small muted">true to magnetic, 20° here</text>
  <text class="muted small" x="20" y="320">Example values. Each angle is signed: east of its reference is positive.</text>
</svg>
