# One entry per algorithm, in the order they're built. status is planned until the
# test data is published; issue is where the work is tracked until then.
- name: Magnetic declination
  slug: wmm
  gives: Declination, inclination and field strength for a place and date
  standard: WMM2025
  authority: NOAA and BGS
  status: planned
  issue: 1
- name: UTM and MGRS
  slug: utm-mgrs
  gives: Grid references both ways, grid convergence, and typed coordinates parsed
  standard: Karney's Transverse Mercator
  authority: NGA, with GeographicLib as the reference program
  status: planned
  issue: 2
- name: Bearings
  slug: bearings
  gives: Distance and bearing, degrees and mils, compass points, true, magnetic and grid north
  standard: Great circle on a sphere
  authority: GeographicLib as the reference program
  status: planned
  issue: 3
- name: Astronomical time
  slug: astronomical-time
  gives: Julian day, ΔT, sidereal time, and a sky position as azimuth and altitude
  standard: Meeus, Astronomical Algorithms
  authority: USNO and IERS as the reference
  status: planned
  issue: 4
- name: Sun
  slug: sun
  gives: Rise, set, transit, the three twilights, azimuth and altitude
  standard: Meeus, Astronomical Algorithms
  authority: USNO as the reference
  status: planned
  issue: 5
- name: Moon
  slug: moon
  gives: Rise, set, transit, illumination, phase, and the dates of the next phases
  standard: Meeus, Astronomical Algorithms
  authority: USNO as the reference
  status: planned
  issue: 6
