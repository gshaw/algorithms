<!doctype html>
<html lang="en">

{% include head.html %}

<body>
  <main class="container">
    <h1>
      <a href="/"><img alt="" src="{{ site.icon }}" width="48" height="48"></a>
      <span style="vertical-align: middle">{{ page.title }}</span>
    </h1>

    {% if page.subtitle %}<p>{{ page.subtitle }}</p>{% endif %}

    {{ content }}

    <hr>

    <p>
      <a href="/">{{ site.title }}</a>
      •
      <a href="{{ site.repo }}">GitHub</a>
      •
      © {{ site.start_year }} <a href="{{ site.author.url }}">{{ site.author.name }}</a>
    </p>
  </main>
</body>

</html>
