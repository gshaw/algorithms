<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url == "/" %}{{ site.title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
  {% assign description = page.description | default: site.description -%}
  {% assign canonical = page.url | remove: ".html" | absolute_url -%}
  <meta name="description" content="{{ description | escape }}">
  <link rel="canonical" href="{{ canonical }}">

  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ description | escape }}">
  <meta property="og:url" content="{{ canonical }}">
  <meta property="og:image" content="{{ '/favicon.192x192.png' | absolute_url }}">

  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="icon" sizes="192x192" href="/favicon.192x192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <link rel="stylesheet" href="/assets/css/pico.min.css">
  <style>
    h1,
    h2,
    h3,
    h4 {
      margin-bottom: 0.2em
    }
    h1 img {
      vertical-align: middle;
      margin-right: 0.3em
    }
    th,
    td {
      vertical-align: top
    }
    /* Tables sit flush with the text around them: no cell padding at the edges. */
    th:first-child,
    td:first-child {
      padding-left: 0
    }
    th:last-child,
    td:last-child {
      padding-right: 0
    }
    /* On a phone, a stacked table shows each row as a block: the first cell as its
       title, the rest under it. Four columns at 390 px leave a word per line. */
    @media (max-width: 575px) {
      table.stacked thead {
        display: none
      }
      table.stacked tr,
      table.stacked td {
        display: block
      }
      table.stacked tr {
        padding: 0.75rem 0;
        border-bottom: var(--border-width) solid var(--table-border-color)
      }
      table.stacked td {
        padding: 0;
        border: 0
      }
      table.stacked td:first-child {
        font-weight: 600
      }
      table.stacked td + td {
        margin-top: 0.25rem
      }
    }
    .muted,
    td small {
      color: var(--muted-color)
    }
    td small {
      display: block
    }
  </style>
</head>
