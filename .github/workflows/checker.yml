name: Checker release

# A tag like v0.1.0 builds algorithms-check for each platform and publishes a release,
# which implementations install with mise's github backend.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install_args: go
      - name: Build
        working-directory: checker
        run: |
          go test ./...
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os=${target%/*} arch=${target#*/}
            mkdir -p "dist/$os-$arch"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" \
              -o "dist/$os-$arch/algorithms-check" .
            tar -czf "dist/algorithms-check-$os-$arch.tar.gz" -C "dist/$os-$arch" algorithms-check
          done
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" checker/dist/*.tar.gz \
            --title "Checker $GITHUB_REF_NAME" \
            --notes 'algorithms-check. Install with mise: "github:gshaw/algorithms" = { version = "latest", exe = "algorithms-check" }'
