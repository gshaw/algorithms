$schema: "https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json"
version: "0.2"
language: en,en-GB
allowCompoundWords: true
ignorePaths:
  - ".git"
  - ".claude"
  - ".wrangler"
  - "_site"
  - ".jekyll-cache"
  - "vendor"
  - "Gemfile.lock"
  - "assets/css/pico.min.css"
  - "wmm/sources" # NOAA's files, verbatim
words:
  - gshaw
  - jsonify # Liquid filter
  - kramdown
  - markdownify # Liquid filter
  - Nanoteslas # WMM field units, in field names
  - Segoe # the diagrams' fallback font
  - lede # the subtitle class
  - pico
  - Ellip # NOAA's WMM library, called by scripts/wmm/reference.c
  - coefs # NOAA's WMM library
  # Standards, authorities and authors.
  - Karney
  - Krüger
  - Meeus
  - Boneh # a WMM2025 report author
  - Chulliat # a WMM2025 report author
  - IAMSAR
  - IERS # International Earth Rotation and Reference Systems Service
  - MGRS
  - NOAA
  - NCEI
  - USNO
  # Other names.
  - humidex
  - Tobler
  - tzdb
