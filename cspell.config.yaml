$schema: "https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json"
version: "0.2"
language: en,en-GB
allowCompoundWords: true
ignorePaths:
  - ".git"
  - ".claude"
  - ".wrangler"
  - "_site"
  - ".jekyll-cache"
  - "vendor"
  - "Gemfile.lock"
  - "assets/css/pico.min.css"
  - "wmm/sources" # NOAA's files, verbatim
  - "utm-mgrs/sources" # GeoConvert's output, verbatim
  - "astronomical-time/sources" # USNO's and ERFA's output, verbatim
  - "bearings/sources"
  - "sun/sources" # USNO's and Skyfield's output, verbatim
  - "moon/sources" # USNO's and Skyfield's output, verbatim # GeodSolve's output and the manuals' text, verbatim
words:
  - gshaw
  - jsonify # Liquid filter
  - kramdown
  - markdownify # Liquid filter
  - Nanoteslas # WMM field units, in field names
  - Segoe # the diagrams' fallback font
  - lede # the subtitle class
  - pico
  - Ellip # NOAA's WMM library, called by scripts/wmm/reference.c
  - coefs # NOAA's WMM library
  # Standards, authorities and authors.
  - Karney
  - ERFA # Essential Routines for Fundamental Astronomy
  - pyerfa
  - rstt # a USNO API path
  - celnav # a USNO API path
  - Skyfield
  - altaz # Skyfield's method
  - phen # USNO's phenomenon field
  - phens
  - fracillum # USNO's fraction lit
  - nump # a USNO API parameter
  - curphase # USNO's phase name
  - preds # USNO's deltat.preds
  - gmst # USNO's and ERFA's Greenwich mean sidereal time
  - lmst # USNO's local mean sidereal time
  - intv # a USNO API parameter
  - Krüger
  - Meeus
  - Boneh # a WMM2025 report author
  - Chulliat # a WMM2025 report author
  - IAMSAR
  - IERS # International Earth Rotation and Reference Systems Service
  - MGRS
  - STND # NGA.STND.0037, the MGRS standard
  - NOAA
  - NCEI
  - USNO
  # Other names.
  - McMurdo
  - Tromsø
  - tromso
  - Ushuaia
  - humidex
  - Tobler
  - tzdb
